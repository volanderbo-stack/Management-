<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D6A56">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Розумний менеджмент</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Помічник для вивчення дисципліни «Менеджмент»: теми, тести, картки, словник і прогрес.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one narrow study column (max 640px), sticky top bar, fixed bottom tab bar; highlighter-yellow marks exam material */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#17201C; --muted:#56645D; --line:#D7DDD5;
  --accent:#0D6A56; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --mark:#F6DB6A; --mark-ink:#2B2300; --mark-soft:#FBF1C4;
  --good:#23804D; --good-soft:#DCF1E3; --bad:#B23C2A; --bad-soft:#F8E1DC;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 4px 14px rgba(20,40,30,.06);
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#171F1B; --surface-2:#202A25; --ink:#E6EDE9; --muted:#9DABA3; --line:#2B3631;
  --accent:#5CCAA8; --accent-ink:#06261D; --accent-soft:#183A30;
  --mark:#D8BC45; --mark-ink:#1E1800; --mark-soft:#3A3315;
  --good:#62C48D; --good-soft:#173726; --bad:#EE8670; --bad-soft:#3E1D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#171F1B; --surface-2:#202A25; --ink:#E6EDE9; --muted:#9DABA3; --line:#2B3631;
  --accent:#5CCAA8; --accent-ink:#06261D; --accent-soft:#183A30;
  --mark:#D8BC45; --mark-ink:#1E1800; --mark-soft:#3A3315;
  --good:#62C48D; --good-soft:#173726; --bad:#EE8670; --bad-soft:#3E1D17;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0;line-height:1.2}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
main{max-width:640px;margin:0 auto;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:24px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.lead{color:var(--muted);font-size:16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
/* topic list */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 10px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:var(--muted);line-height:1.3;display:block;margin-top:4px}
.tlist{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.titem{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.titem .n{font-family:var(--f-display);font-weight:600;font-size:15px;width:40px;height:40px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-variant-numeric:tabular-nums}
.titem .t{font-weight:600;line-height:1.3;min-width:0}
.chip{font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.wrap{white-space:normal;line-height:1.35;max-width:100%}
.chip.read{background:var(--accent-soft);color:var(--accent)}
.chip.pass{background:var(--good-soft);color:var(--good)}
.chip.low{background:var(--bad-soft);color:var(--bad)}
.titem.done .n{background:var(--good-soft);color:var(--good)}
/* topic detail */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:8px 0;color:var(--accent);font-weight:600;cursor:pointer;font-size:16px}
.minute{background:var(--accent-soft);border-radius:var(--r);padding:16px}
.minute .eyebrow{color:var(--accent)}
.theory{font-size:17px}
.theory p,.theory ul,.theory ol{margin:0 0 12px}
.theory ul,.theory ol{padding-left:22px}
.theory li{margin-bottom:6px}
.theory b{font-weight:650}
.simple{border:2px dashed var(--accent);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.ex{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ex li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.examq{background:var(--mark-soft);border-radius:var(--r);padding:16px}
.examq ol{margin:8px 0 0;padding-left:22px}
.examq li{margin-bottom:6px}
.hl{background:var(--mark);color:var(--mark-ink);padding:0 4px;border-radius:4px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* quiz */
.qbar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.qtext{font-size:19px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-size:16.5px;line-height:1.4}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:14px}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.explain{border-radius:12px;padding:12px 14px;background:var(--surface-2)}
.explain b{display:block;margin-bottom:4px}
.big{font-family:var(--f-display);font-size:48px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.score-ring{display:flex;align-items:center;gap:16px}
.review{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.review button{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
/* cards */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14.5px;cursor:pointer;min-height:40px}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.flash{perspective:1200px;min-height:260px;cursor:pointer;border:0;background:none;padding:0;width:100%;text-align:center}
.flash-in{position:relative;width:100%;min-height:260px;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px 20px}
.face.back-f{transform:rotateY(180deg);background:var(--accent-soft)}
.face .term{font-family:var(--f-display);font-weight:600;font-size:23px;line-height:1.3;text-wrap:balance}
.face .def{font-size:18px;line-height:1.5}
.face .hint{font-size:13px;color:var(--muted)}
.state-dot{font-size:13px;font-weight:600}
/* glossary */
.search{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:12px 14px;font:inherit;color:var(--ink)}
.search:focus{border-color:var(--accent);outline:none}
.glist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.glist li{padding:14px 0;border-bottom:1px solid var(--line)}
.glist .gt{font-weight:700;font-size:17px}
.glist .gd{color:var(--ink);margin-top:2px}
.glist .gl{margin-top:6px;background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:14px;cursor:pointer}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}
/* progress */
.pt{display:grid;grid-template-columns:1fr 52px;gap:4px 12px;align-items:center}
.pt .name{font-weight:600;font-size:15px;min-width:0}
.pt .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.pt .bar{grid-column:1/-1;height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pt .bar i{display:block;height:100%;background:var(--accent)}
.pt .bar i.good{background:var(--good)}
.pt .bar i.bad{background:var(--bad)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.hist li{display:flex;justify-content:space-between;gap:10px}
.hist span:last-child{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{color:var(--muted);font-size:15px}
.confirm{border:1.5px solid var(--bad);border-radius:12px;padding:14px;background:var(--bad-soft)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 10px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;min-height:58px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{stroke-width:2.4}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top"><div class="top-in">
  <div class="brand"><small>НТУ «ХПІ» · дисципліна</small>Розумний менеджмент</div>
  <button class="icon-btn" id="themeBtn" type="button" aria-label="Змінити тему"></button>
</div></header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" aria-label="Розділи"><div class="tabs-in" id="tabs"></div></nav>
<div class="toast" id="toast" hidden></div>

<script>
const TOPICS = [
{
id:"sut", title:"Суть і роль менеджменту",
min:"Менеджмент — це вміння досягати цілей організації руками інших людей, розумно використовуючи ресурси: людей, гроші, час, інформацію. Менеджер не робить усе сам, він планує, організовує, мотивує й контролює. Менеджмент одночасно наука (має закони й методи), мистецтво (залежить від таланту й досвіду) і вид діяльності.",
theory:`<p><b>Менеджмент</b> (від англ. <i>to manage</i> — керувати) — це процес планування, організування, мотивування і контролю, потрібний для того, щоб сформулювати й досягти цілей організації. Класичне визначення з підручника Мескона, Альберта і Хедоурі: менеджмент — це вміння досягати поставлених цілей, використовуючи працю, інтелект і мотиви поведінки інших людей.</p>
<p>Слово «менеджмент» вживають у трьох значеннях:</p>
<ul><li><b>як вид діяльності</b> — те, що щодня роблять керівники;</li>
<li><b>як наука і навчальна дисципліна</b> — систематизовані знання про управління;</li>
<li><b>як апарат управління</b> — люди, які керують (наприклад, «менеджмент компанії вирішив…»).</li></ul>
<p><b>Об'єкт управління</b> — те, чим керують (колектив, підрозділ, процес). <b>Суб'єкт управління</b> — той, хто керує (менеджер, рада директорів).</p>
<p>Менеджмент — це і <b>наука</b>, і <b>мистецтво</b>. Наука, бо має закони, принципи, методи, які можна вивчити. Мистецтво, бо в реальній ситуації рішення залежить від інтуїції, досвіду й уміння працювати з людьми.</p>
<p><b>Основні методи менеджменту:</b></p>
<ul><li><b>економічні</b> — премії, штрафи, бюджети, ціни (вплив через матеріальний інтерес);</li>
<li><b>організаційно-розпорядчі (адміністративні)</b> — накази, інструкції, регламенти;</li>
<li><b>соціально-психологічні</b> — переконання, приклад, корпоративна культура, командоутворення.</li></ul>
<p><b>Принципи менеджменту</b> — базові правила: цілеспрямованість, системність, науковість, поєднання єдиноначальності й колегіальності, ефективність, зворотний зв'язок.</p>
<p><b>Роль менеджменту:</b> без управління ресурси розпорошуються. Саме якістю менеджменту часто пояснюють, чому дві фірми з однаковими можливостями мають зовсім різні результати.</p>`,
simple:"Уяви, що ти організовуєш з друзями поїздку в Карпати. Треба вирішити, куди і коли їхати (планування), хто купує квитки, хто їжу (організування), як переконати лінивого друга встати о 6 ранку (мотивування) і перевірити, чи ніхто не забув паспорт (контроль). Ось це і є менеджмент, тільки у фірмі ставки вищі.",
examples:[
"«Нова пошта» починала 2001 року в Полтаві з кількох авто. Розумне планування мережі відділень, чіткі стандарти доставки і контроль термінів допомогли їй стати лідером ринку. Ресурси в конкурентів були, а такого управління — ні.",
"Кав'ярня біля університету: власник сам варив каву, поки не відкрив другу точку. Далі довелося найняти бариста, написати стандарти рецептів і перевіряти виручку. Він перейшов від «роблю сам» до «керую тим, як роблять інші».",
"Метод управління на практиці: щоб скоротити запізнення, компанія може ввести штраф (економічний метод), видати наказ про графік (адміністративний) або провести розмову про командну відповідальність (соціально-психологічний)."
],
exam:["Дайте визначення менеджменту. Чим менеджмент відрізняється від управління взагалі?","Назвіть три значення терміна «менеджмент».","Чому менеджмент — це одночасно наука і мистецтво?","Які групи методів менеджменту ви знаєте? Наведіть приклади.","Що таке суб'єкт і об'єкт управління?"],
quiz:[
{q:"Що з наведеного найточніше описує менеджмент?",o:["Вміння досягати цілей організації, використовуючи працю й мотиви інших людей","Ведення бухгалтерського обліку підприємства","Продаж товарів кінцевому споживачу","Виконання всіх робіт керівником особисто"],a:0,e:"Класичне визначення (Мескон, Альберт, Хедоурі): менеджмент — досягнення цілей через інших людей. Облік і продаж — окремі функції бізнесу, а не суть управління."},
{q:"Накази, інструкції та посадові регламенти належать до методів…",o:["економічних","організаційно-розпорядчих","соціально-психологічних","статистичних"],a:1,e:"Організаційно-розпорядчі (адміністративні) методи впливають через пряме розпорядження: накази, інструкції, правила."},
{q:"Премія за перевиконання плану — це приклад методу…",o:["соціально-психологічного","адміністративного","економічного","технологічного"],a:2,e:"Економічні методи діють через матеріальний інтерес: гроші, премії, штрафи."},

{q:"Чому менеджмент називають мистецтвом?",o:["Бо менеджери вміють малювати","Бо в ньому немає жодних правил","Бо застосування знань залежить від досвіду, інтуїції та вміння працювати з людьми","Бо його вивчають у художніх академіях"],a:2,e:"Правила й методи існують (це наука), але кожна ситуація унікальна, тож потрібні талант і досвід — це мистецтво."},
{q:"Фраза «Менеджмент компанії ухвалив нову стратегію» вживає слово «менеджмент» у значенні…",o:["науки","виду діяльності","апарату управління (людей, що керують)","навчальної дисципліни"],a:2,e:"Тут ідеться про групу людей, які керують, тобто апарат управління."},
{q:"Корпоративні свята і командоутворення — це методи…",o:["соціально-психологічні","економічні","адміністративні","фінансові"],a:0,e:"Вони впливають на настрій, стосунки і цінності людей, тобто на психологію колективу."}
]},
{
id:"menedzher", title:"Менеджер: рівні, ролі, навички",
min:"Менеджер — це людина, яка керує роботою інших. Є три рівні: вищий (стратегія), середній (координація) і нижчий (керує виконавцями). Мінцберг описав 10 ролей менеджера у трьох групах, а Кац — три групи навичок: технічні, людські й концептуальні.",
theory:`<p><b>Менеджер</b> — керівник, який має повноваження ухвалювати рішення і керує роботою інших людей.</p>
<p><b>Рівні управління</b> (за Т. Парсонсом):</p>
<ul><li><b>вищий (інституційний)</b> — директор, власник, рада директорів; визначає стратегію і місію;</li>
<li><b>середній (управлінський)</b> — начальники відділів, регіональні керівники; перекладають стратегію в конкретні завдання і координують;</li>
<li><b>нижчий (технічний)</b> — майстер, бригадир, керівник зміни; безпосередньо керує виконавцями.</li></ul>
<p><b>Ролі менеджера за Генрі Мінцбергом</b> (1973) — 10 ролей у трьох групах:</p>
<ul><li><b>міжособистісні</b>: головний керівник (представляє фірму), лідер, сполучна ланка;</li>
<li><b>інформаційні</b>: приймач інформації (монітор), розповсюджувач, представник (речник);</li>
<li><b>ролі з ухвалення рішень</b>: підприємець, той, хто усуває порушення, розподільник ресурсів, ведучий переговорів.</li></ul>
<p><b>Навички менеджера за Робертом Кацом</b> (1955):</p>
<ul><li><b>технічні</b> — знання своєї справи (бухгалтерія, програмування) — найважливіші на нижчому рівні;</li>
<li><b>людські (комунікативні)</b> — вміння працювати з людьми — важливі на всіх рівнях;</li>
<li><b>концептуальні</b> — бачити картину в цілому, мислити стратегічно — найважливіші на вищому рівні.</li></ul>
<p>Чим вище рівень, тим більше часу менеджер витрачає на планування і спілкування і тим менше — на «ручну» технічну роботу.</p>`,
simple:"Уяви піцерію. Власник думає, чи відкривати заклад у Львові (вищий рівень). Керуючий закладом складає графік змін і стежить, щоб вистачало сиру (середній). Старший кухар на зміні показує новенькому, як розкатати тісто (нижчий). Усі троє — менеджери, просто масштаб різний.",
examples:[
"В АТБ: топменеджмент у Дніпрі вирішує, скільки нових магазинів відкрити за рік; регіональний керівник розподіляє їх по містах; директор конкретного магазину стежить за касами і викладкою.",
"Роль «ведучого переговорів» за Мінцбергом: директор IT-компанії домовляється з іноземним клієнтом про умови контракту.",
"Технічні навички важливі тімліду розробників: він має розбиратися в коді. А генеральному директору тієї ж компанії потрібніше концептуальне мислення: куди рухається ринок."

{
id:"evolutsiia", title:"Еволюція управлінської думки",
min:"Управління як наука з'явилося на початку XX ст. Тейлор (наукове управління) вчив раціоналізувати роботу робітника. Файоль (адміністративна школа) описав функції і 14 принципів управління всією організацією. Мейо (школа людських стосунків) показав, що увага до людей підвищує продуктивність. Вебер описав ідеальну бюрократію. Потім з'явилися системний і ситуаційний підходи.",
theory:`<p><b>1. Школа наукового управління (1885–1920).</b> Засновник — <b>Фредерік Тейлор</b> (США), книга «Принципи наукового управління» (1911). Ідеї: вивчати операції з хронометражем, встановлювати норми, відбирати і навчати робітників, платити за результат (диференційована відрядна оплата), відокремити планування роботи від її виконання. Соратники: подружжя <b>Френк і Ліліан Гілбрет</b> (вивчення рухів), <b>Генрі Гант</b> (діаграма Ганта).</p>
<p><b>2. Класична (адміністративна) школа (1920–1950).</b> <b>Анрі Файоль</b> (Франція), праця «Загальне і промислове управління» (1916). Він дивився на організацію згори і виділив п'ять функцій управління: передбачення (планування), організація, розпорядництво, координація, контроль. Сформулював <b>14 принципів</b>: поділ праці, повноваження і відповідальність, дисципліна, єдиноначальність, єдність напрямку, підпорядкування особистих інтересів загальним, винагорода, централізація, скалярний ланцюг (ієрархія), порядок, справедливість, стабільність персоналу, ініціатива, корпоративний дух.</p>
<p><b>Макс Вебер</b> (Німеччина) розробив модель <b>«ідеальної бюрократії»</b>: чіткий поділ праці, ієрархія, формальні правила, безособові стосунки, призначення за компетентністю. Бюрократія тут — не «тяганина», а раціональна організація.</p>
<p><b>3. Школа людських стосунків і поведінкові науки (1930–1950 і далі).</b> <b>Елтон Мейо</b> провів <b>Хоторнські експерименти</b> (1924–1932, завод Western Electric). Висновок: на продуктивність сильно впливають увага до працівників, стосунки в групі, неформальні норми («хоторнський ефект»). Пізніше поведінкова школа (Маслоу, МакГрегор з теоріями X і Y, Герцберг, Лайкерт) вивчала мотивацію і лідерство.</p>
<p><b>4. Кількісний підхід (з 1950-х).</b> Математика, статистика, моделювання, дослідження операцій.</p>
<p><b>5. Процесний підхід.</b> Управління — безперервний ланцюг пов'язаних функцій (ідея походить від Файоля).</p>
<p><b>6. Системний підхід (кінець 1950-х).</b> Організація — <b>відкрита система</b>, що отримує ресурси із середовища (вхід), перетворює їх і віддає результат (вихід). Спирається на загальну теорію систем Л. фон Берталанфі.</p>
<p><b>7. Ситуаційний підхід (1960-ті).</b> «Найкращого способу управління для всіх випадків не існує»: метод обирають залежно від ситуації (ситуаційних змінних).</p>`,
simple:"Згадай, як змінювалися підходи до навчання в школі. Спершу: «зубри правила, роби як сказано» (Тейлор). Потім: «треба, щоб уся школа мала розклад і директора» (Файоль, Вебер). Далі помітили, що учні краще вчаться, коли вчитель їх хвалить (Мейо). Нарешті зрозуміли, що школа залежить від міста, батьків, держави (системний підхід), і що до кожного класу потрібен свій підхід (ситуаційний).",

{q:"Який із принципів НЕ належить до 14 принципів Файоля?",o:["Єдиноначальність","Корпоративний дух","Хронометраж операцій","Стабільність персоналу"],a:2,e:"Хронометраж — інструмент наукового управління Тейлора, а не принцип Файоля."},

{
id:"funktsii", title:"Функції менеджменту",
min:"Чотири основні функції: планування (що і коли робити), організування (хто і як робить), мотивування (як спонукати людей працювати) і контроль (чи досягли мети). Їх поєднують зв'язуючі процеси: комунікації і прийняття рішень. Разом це управлінський цикл.",
theory:`<p>За моделлю Мескона, Альберта і Хедоурі, процес управління складається з <b>чотирьох взаємопов'язаних функцій</b>:</p>
<p><b>1. Планування</b> — визначення цілей і шляхів їх досягнення. Види: <b>стратегічне</b> (на роки, для всієї організації), <b>тактичне</b> (середньострокове, для підрозділів), <b>оперативне</b> (на день, тиждень, місяць). Результат — плани, бюджети, графіки.</p>
<p><b>2. Організування</b> — створення структури: хто що робить, хто кому підпорядковується. Ключові поняття: <b>делегування</b> (передача завдань і повноважень підлеглому), <b>повноваження</b> (обмежене право використовувати ресурси), <b>відповідальність</b> (обов'язок виконати завдання і відповісти за результат). Повноваження бувають лінійні і штабні (апаратні). <b>Норма керованості</b> — скільки людей може ефективно підпорядковуватися одному керівнику.</p>
<p><b>3. Мотивування</b> — спонукання себе та інших до діяльності для досягнення цілей. Спирається на змістовні та процесуальні теорії мотивації.</p>
<p><b>4. Контроль</b> — перевірка, чи досягає організація своїх цілей. <b>Етапи:</b> встановлення стандартів, вимірювання і порівняння фактичних результатів зі стандартами, коригування. <b>Види за часом:</b> попередній (до початку роботи: перевірка сировини, відбір кадрів), поточний (під час роботи), заключний (після завершення).</p>
<p><b>Зв'язуючі процеси</b> — <b>комунікації</b> і <b>ухвалення рішень</b> — потрібні для виконання всіх чотирьох функцій.</p>
<p>Функції утворюють <b>управлінський цикл</b>: результати контролю стають основою для нового планування.</p>
<p>Нагадування з історії: Файоль виділяв п'ять функцій — передбачення, організація, розпорядництво, координація і контроль.</p>`,
simple:"Ти вирішив підготуватися до сесії. Планування: «за два тижні пройду 15 тем, по одній на день». Організування: розклад, конспекти, домовився з одногрупником обмінюватися питаннями. Мотивування: після кожної теми — серія улюбленого серіалу. Контроль: в кінці тижня тест, бачиш, що відстаєш на дві теми, і коригуєш план. Цикл замкнувся.",
examples:[
"Планування в «Сільпо»: стратегічний план на 3–5 років (нові формати магазинів), тактичний на квартал (акції в регіоні), оперативний (графік поставок на тиждень).",
"Делегування: власник інтернет-магазину передає менеджеру повноваження відповідати клієнтам і повертати гроші до 2000 грн без погодження.",
"Попередній контроль: кондитерська фабрика перевіряє якість какао-бобів до виробництва. Поточний: дегустація під час варіння. Заключний: аналіз скарг покупців.",
"Мотивування в монобанку: бонуси за результати, гнучкий графік і сильний бренд роботодавця."
],

{q:"Який правильний порядок етапів контролю?",o:["Коригування → стандарти → порівняння","Встановлення стандартів → порівняння результатів → коригування","Порівняння → стандарти → звільнення","Планування → мотивування → коригування"],a:1,e:"Спочатку стандарти, потім вимірювання і порівняння, а тоді коригування."},

{
id:"systema", title:"Організація як система. Внутрішнє і зовнішнє середовище",
min:"Організація — група людей, яка свідомо координує діяльність для спільних цілей. Вона відкрита система: бере ресурси із середовища і віддає продукцію. Внутрішнє середовище — цілі, структура, завдання, технологія, люди. Зовнішнє — прямого впливу (споживачі, постачальники, конкуренти, держава) і непрямого (економіка, політика, технології, суспільство, міжнародні події).",
theory:`<p><b>Організація</b> — група людей, діяльність яких свідомо координується для досягнення спільної мети. <b>Обов'язкові ознаки:</b> щонайменше дві людини, які вважають себе частиною групи; щонайменше одна спільна мета; свідома спільна праця.</p>
<p><b>Організація як система.</b> Система — це ціле з взаємопов'язаних частин. Організація — <b>відкрита система</b>: <b>входи</b> (сировина, люди, гроші, інформація) → <b>перетворення</b> → <b>виходи</b> (товари, послуги, прибуток) + <b>зворотний зв'язок</b>. Ще одна властивість систем — <b>синергія</b>: ціле дає більше, ніж сума частин окремо.</p>
<p><b>Внутрішні змінні</b> (керовані менеджером):</p>
<ul><li><b>цілі</b> — бажаний стан, до якого прагне організація;</li>
<li><b>структура</b> — рівні управління і підрозділи;</li>
<li><b>завдання</b> — робота, яку треба виконати;</li>
<li><b>технологія</b> — спосіб перетворення ресурсів на продукт;</li>
<li><b>люди</b> — працівники з їхніми здібностями, потребами, цінностями.</li></ul>
<p><b>Зовнішнє середовище прямого впливу</b> (мікросередовище): споживачі, постачальники, конкуренти, закони і державні органи, профспілки.</p>
<p><b>Зовнішнє середовище непрямого впливу</b> (макросередовище): стан економіки, науково-технічний прогрес, соціокультурні та політичні чинники, міжнародні події.</p>
<p><b>Характеристики зовнішнього середовища:</b> <b>взаємозв'язаність</b> чинників (зміна одного тягне інші), <b>складність</b> (кількість чинників), <b>рухливість</b> (швидкість змін), <b>невизначеність</b> (брак інформації про середовище).</p>`,
simple:"Твоя сім'я — теж маленька система. Всередині: бюджет, хто що робить по дому, які у вас цілі на літо. Ззовні: ціни в магазині, зарплатня, тарифи на світло, погода. Ціни ви не контролюєте, але мусите до них підлаштовуватися. Так само фірма: внутрішнім керує, на зовнішнє реагує.",
examples:[
"Відкрита система: молочний завод отримує молоко від фермерів (вхід), переробляє на сир і йогурти (перетворення), продає в мережі (вихід), а відгуки покупців (зворотний зв'язок) підказують, які смаки додати.",
"Чинник прямого впливу: нова вимога Податкової або зміна правил ПРРО для ФОП напряму змінює роботу малого бізнесу.",
"Чинник непрямого впливу: відключення електроенергії 2022–2023 років змусили бізнес купувати генератори і Starlink, а мережі на кшталт «Пузата хата» переналаштовували роботу кухонь.",
"Синергія: окремо дизайнер і програміст роблять половину сайту кожен, а разом — продукт, який можна продати."
],
exam:["Дайте визначення організації і назвіть її ознаки.","Чому організація — відкрита система?","Внутрішні змінні організації.","Фактори прямого і непрямого впливу зовнішнього середовища.","Характеристики зовнішнього середовища."],
quiz:[
{q:"Що з переліченого належить до внутрішніх змінних організації?",o:["Конкуренти","Технологія","Інфляція","Політична ситуація"],a:1,e:"Внутрішні змінні: цілі, структура, завдання, технологія, люди."},
{q:"Постачальники належать до середовища…",o:["прямого впливу","непрямого впливу","внутрішнього","не належать до середовища"],a:0,e:"Постачальники безпосередньо впливають на роботу фірми, тож це середовище прямого впливу."},
{q:"Науково-технічний прогрес — це чинник середовища…",o:["прямого впливу","непрямого впливу","внутрішнього","особистого"],a:1,e:"НТП впливає опосередковано, через зміну технологій і ринку."},
{q:"Швидкість, з якою змінюється оточення організації, — це…",o:["складність","рухливість","взаємозв'язаність","синергія"],a:1,e:"Рухливість (динамічність) — швидкість змін у середовищі."},
{q:"Чому організацію називають відкритою системою?",o:["Бо в неї вільний вхід","Бо вона взаємодіє із зовнішнім середовищем","Бо вона працює цілодобово","Бо в неї немає структури"],a:1,e:"Вона отримує ресурси ззовні й віддає продукцію назовні."},
{q:"Ефект, коли результат спільної роботи перевищує суму окремих результатів, — це…",o:["синергія","ентропія","децентралізація","делегування"],a:0,e:"Синергія: «1 + 1 > 2»."}
]},
{
id:"swot", title:"SWOT і PEST-аналіз",
min:"SWOT — таблиця з чотирьох частин: сильні сторони (S) і слабкі сторони (W) — це про саму фірму, можливості (O) і загрози (T) — про зовнішнє середовище. PEST аналізує зовнішнє макросередовище за чотирма групами: політичні, економічні, соціальні і технологічні чинники.",
theory:`<p><b>SWOT-аналіз</b> — інструмент стратегічного аналізу. Абревіатура:</p>
<ul><li><b>S — Strengths</b>, сильні сторони (внутрішнє);</li>
<li><b>W — Weaknesses</b>, слабкі сторони (внутрішнє);</li>
<li><b>O — Opportunities</b>, можливості (зовнішнє);</li>
<li><b>T — Threats</b>, загрози (зовнішнє).</li></ul>
<p>Головна логіка: <b>S і W ми контролюємо</b>, бо це про нас. <b>O і T ми не контролюємо</b>, бо це про ринок і світ. Найпоширеніша помилка студентів — записати «можливість відкрити новий магазин» у O. Це дія фірми, а не зовнішня можливість. Правильно: «зростає попит на доставку в місті».</p>
<p><b>Матриця SWOT</b> поєднує частини в стратегії:</p>
<ul><li><b>SO</b> — використати сильні сторони, щоб скористатися можливостями;</li>
<li><b>WO</b> — подолати слабкі сторони за рахунок можливостей;</li>
<li><b>ST</b> — сильними сторонами захиститися від загроз;</li>
<li><b>WT</b> — мінімізувати слабкості й уникнути загроз (оборонна стратегія).</li></ul>
<p><b>PEST-аналіз</b> (інколи STEP) досліджує <b>макросередовище</b>:</p>
<ul><li><b>P — Political</b>: закони, податки, регулювання, політична стабільність, воєнний стан;</li>
<li><b>E — Economic</b>: інфляція, курс валют, облікова ставка, доходи населення;</li>
<li><b>S — Social</b>: демографія, міграція, спосіб життя, освіта, мода;</li>
<li><b>T — Technological</b>: нові технології, цифровізація, автоматизація.</li></ul>
<p>Розширені версії: <b>PESTEL</b> (+ Environmental — екологія, + Legal — право), <b>STEEP</b>. Результати PEST часто використовують як джерело для O і T у SWOT.</p>`,
simple:"Зроби SWOT собі перед іспитом. S: добре пам'ятаю теорії мотивації. W: плутаю структури. O: викладач дає консультацію в четвер. T: в день іспиту можуть вимкнути світло, і онлайн-тест зірветься. Перші два пункти залежать від тебе, другі два — ні. А PEST — це як прогноз погоди для бізнесу: що відбувається навколо загалом.",
examples:[
"SWOT для кав'ярні біля ХПІ. S: вигідне розташування, швидке обслуговування. W: мала зала, немає доставки. O: багато студентів, зростає популярність кави з собою. T: відкриття мережевої кав'ярні поруч, перебої зі світлом.",
"PEST для українського IT-бізнесу. P: воєнний стан, правовий режим «Дія City». E: курс гривні, вартість найму. S: міграція фахівців, віддалена робота. T: розвиток штучного інтелекту.",
"Стратегія SO: компанія Ajax Systems з сильними інженерними кадрами (S) використала зростання попиту на системи безпеки у світі (O), щоб вийти на ринки понад 100 країн."
],
exam:["Розшифруйте SWOT. Які фактори внутрішні, а які зовнішні?","Як будується матриця SWOT і які стратегії з неї випливають?","Розшифруйте PEST і наведіть приклади кожної групи.","Чим PEST відрізняється від SWOT?"],
quiz:[
{q:"Які елементи SWOT описують внутрішнє середовище?",o:["S і W","O і T","S і O","W і T"],a:0,e:"Strengths і Weaknesses — характеристики самої організації."},
{q:"«Зростання курсу долара» для компанії-імпортера в SWOT — це…",o:["сильна сторона","слабка сторона","можливість","загроза"],a:3,e:"Зовнішній чинник, що шкодить імпортеру (товар дорожчає), — це загроза (T)."},
{q:"Що означає літера E в PEST?",o:["Екологічні чинники","Економічні чинники","Етичні чинники","Експортні чинники"],a:1,e:"PEST = Political, Economic, Social, Technological. Екологію додають у PESTEL."},
{q:"Демографічні зміни та міграція населення належать до групи…",o:["P","E","S","T"],a:2,e:"Соціальні (Social) чинники: демографія, спосіб життя, цінності."},
{q:"Стратегія WT у матриці SWOT спрямована на…",o:["агресивне зростання","мінімізацію слабкостей і уникнення загроз","використання сильних сторін для можливостей","захоплення лідерства"],a:1,e:"WT — оборонна стратегія."},
{q:"Що з наведеного правильно записати в «Можливості» (O)?",o:["Відкрити новий магазин","Високоякісний персонал","Зростає попит на органічні продукти","Застаріле обладнання"],a:2,e:"Можливість — сприятливий зовнішній чинник. «Відкрити магазин» — дія фірми, персонал — сила, обладнання — слабкість."},
{q:"PEST-аналіз досліджує…",o:["внутрішнє середовище","макросередовище (середовище непрямого впливу)","тільки конкурентів","тільки фінанси фірми"],a:1,e:"PEST оцінює загальні політичні, економічні, соціальні і технологічні тенденції."}
]},
{
id:"strategiia", title:"Стратегічне планування і цілі (SMART)",
min:"Стратегічне планування — це вибір довгострокових цілей і шляху до них. Все починається з місії (навіщо існує фірма), далі цілі, аналіз середовища, вибір стратегії, реалізація і контроль. Цілі мають бути SMART: конкретні, вимірювані, досяжні, доречні і обмежені в часі.",
theory:`<p><b>Стратегічне планування</b> — набір дій і рішень керівництва, що ведуть до розробки стратегій, які допомагають організації досягти цілей.</p>
<p><b>Етапи (за Месконом):</b> 1) місія організації; 2) цілі; 3) оцінка і аналіз зовнішнього середовища; 4) управлінське обстеження сильних і слабких сторін; 5) аналіз стратегічних альтернатив; 6) вибір стратегії; 7) реалізація стратегії (тактика, політика, процедури, правила, бюджети); 8) оцінка і контроль.</p>
<p><b>Місія</b> — основна мета організації, чітко виражена причина її існування. <b>Бачення</b> — образ того, якою організація хоче стати в майбутньому.</p>
<p><b>Цілі за SMART</b> (ідея пов'язана з Дж. Дораном, 1981, і з управлінням за цілями П. Друкера):</p>
<ul><li><b>S — Specific</b>, конкретна;</li><li><b>M — Measurable</b>, вимірювана;</li><li><b>A — Achievable</b>, досяжна;</li><li><b>R — Relevant</b>, доречна (важлива для загальної мети);</li><li><b>T — Time-bound</b>, визначена в часі.</li></ul>
<p><b>Базові стратегії М. Портера:</b> лідерство за витратами, диференціація, фокусування (на сегменті).</p>
<p><b>Еталонні стратегії розвитку:</b> обмежене зростання, зростання, скорочення, поєднання.</p>
<p><b>Матриця Ансоффа</b> («товар — ринок»): проникнення на ринок, розвиток ринку, розвиток товару, диверсифікація.</p>
<p><b>Матриця БКГ</b> (Бостонська консалтингова група) ділить продукти за часткою ринку і темпом зростання ринку: «зірки», «дійні корови», «знаки питання» («важкі діти»), «собаки».</p>
<p><b>Управління за цілями (MBO)</b> — підхід П. Друкера (1954): цілі разом погоджують керівник і підлеглий, а потім оцінюють результат.</p>`,
simple:"Ціль «Схуднути» — не SMART. Ціль «Скинути 3 кг до 1 грудня, бігаючи тричі на тиждень» — SMART: зрозуміло, що робити (S), можна виміряти вагою (M), реально (A), важливо для здоров'я (R), є дата (T). З бізнес-цілями так само: «збільшити продажі» — погано, «збільшити онлайн-продажі на 15% до кінця II кварталу 2027» — добре.",
examples:[
"Місія «Нової пошти» пов'язана з тим, щоб доставляти швидко і зручно для людей і бізнесу. Вона пояснює, навіщо компанія існує, а не скільки заробить.",
"Стратегія лідерства за витратами — АТБ: низькі ціни завдяки простим магазинам і великим обсягам закупівель. Диференціація — «Сільпо»: незвичний дизайн, ширший асортимент і власні кулінарні продукти.",
"Диверсифікація за Ансоффом: «Нова пошта» запустила фінансові послуги (NovaPay) — новий продукт для нового ринку.",
"Матриця БКГ: у кондитерської компанії класичні цукерки — «дійна корова» (стабільний прибуток), протеїнові батончики — «знак питання» (ринок росте, частка поки мала)."
],

{q:"Вихід із новим продуктом на новий ринок у матриці Ансоффа — це…",o:["проникнення на ринок","розвиток ринку","розвиток товару","диверсифікація"],a:3,e:"Новий товар + новий ринок = диверсифікація, найризикованіша стратегія."},
{q:"Концепцію управління за цілями (MBO) запропонував…",o:["П. Друкер","А. Файоль","Е. Мейо","В. Врум"],a:0,e:"Пітер Друкер, «Практика менеджменту» (1954)."}

{
id:"struktury", title:"Організаційні структури",
min:"Організаційна структура показує, як поділено роботу і хто кому підпорядковується. Бюрократичні структури: лінійна, функціональна, лінійно-функціональна, дивізіональна. Органічні (адаптивні): матрична, проєктна, мережева. Чим швидше змінюється середовище, тим гнучкішою має бути структура.",
theory:`<p><b>Організаційна структура</b> — логічні взаємовідносини рівнів управління і підрозділів, побудовані так, щоб найефективніше досягати цілей.</p>
<p><b>Бюрократичні (механістичні, ієрархічні) структури:</b></p>
<ul><li><b>Лінійна</b> — кожен підлеглий має одного керівника, команди йдуть згори вниз. Плюси: простота, єдиноначальність, чітка відповідальність. Мінуси: перевантаження керівника, він має бути «універсалом». Підходить малим фірмам.</li>
<li><b>Функціональна</b> — підрозділи за функціями (виробництво, фінанси, маркетинг), виконавець отримує вказівки від кількох функціональних керівників. Плюс: фахова спеціалізація. Мінус: порушується єдиноначальність, плутанина в командах.</li>
<li><b>Лінійно-функціональна (лінійно-штабна)</b> — лінійні керівники ухвалюють рішення, а функціональні служби (штаб) їх готують і консультують. Найпоширеніша на середніх підприємствах.</li>
<li><b>Дивізіональна</b> — відділення (дивізіони) за продуктом, регіоном або групою споживачів, кожне з певною самостійністю. Підходить великим корпораціям.</li></ul>
<p><b>Органічні (адаптивні) структури:</b></p>
<ul><li><b>Матрична</b> — подвійне підпорядкування: працівник підкоряється і керівнику функціонального відділу, і керівнику проєкту. Плюс: гнучкість, швидкість. Мінус: конфлікти через подвійне підпорядкування.</li>
<li><b>Проєктна</b> — тимчасова команда під конкретне завдання, після його виконання розпускається.</li>
<li><b>Бригадна (командна), мережева, віртуальна</b> — гнучкі форми, де багато функцій передано партнерам (аутсорсинг) або команди працюють дистанційно.</li></ul>
<p><b>Централізація</b> — основні рішення ухвалюються на вищому рівні. <b>Децентралізація</b> — повноваження передано на нижчі рівні.</p>
<p>Що більша норма керованості, то <b>плоскіша</b> структура (менше рівнів). Що менша — то <b>вища</b> (більше рівнів).</p>`,
simple:"Лінійна структура — як сім'я, де все вирішує тато. Функціональна — як школа: математику пояснює математичка, фізкультуру — фізрук, і обоє можуть дати тобі завдання. Матрична — як студент, який і в групі старости, і в команді на хакатоні: два «начальники» одночасно, і інколи вони сперечаються, де ти маєш бути.",
examples:[
"Лінійна: невелика СТО, де власник напряму керує трьома майстрами.",
"Лінійно-функціональна: машинобудівний завод у Харкові, де директор керує цехами, а планово-економічний відділ, відділ кадрів і бухгалтерія готують йому дані й рекомендації.",
"Дивізіональна за регіонами: банк має регіональні дирекції (Схід, Захід, Центр), і кожна відповідає за свої відділення.",
"Матрична: в IT-компанії розробниця підпорядковується тімліду свого напряму (функція) і менеджеру проєкту клієнта одночасно."
],
exam:["Що таке організаційна структура?","Порівняйте лінійну і функціональну структури: переваги і недоліки.","Особливості дивізіональної структури.","Матрична структура: суть, плюси, мінуси.","Відмінності бюрократичних і органічних структур."],

{q:"Структура, де підрозділи виділено за продуктами або регіонами, називається…",o:["лінійною","дивізіональною","проєктною","функціональною"],a:1,e:"Дивізіони утворюють за продуктом, регіоном або споживачем."},
{q:"Яка структура належить до органічних (адаптивних)?",o:["Лінійна","Функціональна","Проєктна","Лінійно-функціональна"],a:2,e:"Проєктна (як і матрична) — гнучка, тимчасова, адаптивна."},
{q:"Якщо збільшити норму керованості, структура стане…",o:["вищою (більше рівнів)","плоскішою (менше рівнів)","матричною","не зміниться"],a:1,e:"Кожен керівник керує більшою кількістю людей, тому потрібно менше рівнів."},
{q:"Передача права ухвалювати рішення на нижчі рівні управління — це…",o:["централізація","децентралізація","бюрократизація","формалізація"],a:1,e:"Децентралізація розширює самостійність підрозділів."}
]},
{
id:"motyvatsiia", title:"Мотивація: теорії Маслоу, Герцберга, МакКлелланда, Врума",
min:"Мотивація — це те, що спонукає людину діяти. Змістовні теорії відповідають на питання «ЩО мотивує?» (Маслоу, Герцберг, МакКлелланд, Альдерфер). Процесуальні — «ЯК виникає мотивація?» (Врум, Адамс, Портер–Лоулер). Маслоу — п'ять рівнів потреб. Герцберг — гігієнічні фактори і мотиватори. МакКлелланд — потреби влади, успіху і причетності. Врум — мотивація = очікування × інструментальність × валентність.",
theory:`<p><b>Мотивація</b> — процес спонукання себе та інших до діяльності для досягнення особистих цілей і цілей організації. <b>Потреба</b> — відчуття нестачі чогось. <b>Мотив</b> — внутрішня причина дії. <b>Стимул</b> — зовнішній чинник, що викликає дію (наприклад, премія).</p>
<p><b>ЗМІСТОВНІ ТЕОРІЇ</b></p>
<p><b>Абрахам Маслоу</b> (1943) — ієрархія потреб, «піраміда»: 1) фізіологічні (їжа, сон); 2) безпеки і захищеності; 3) соціальні (належність, дружба); 4) повага (визнання, статус); 5) самовираження (самоактуалізація). Наступна потреба стає мотивом, коли нижча відносно задоволена.</p>
<p><b>Фредерік Герцберг</b> (1959) — двофакторна теорія. <b>Гігієнічні фактори</b> (зарплата, умови праці, політика компанії, стосунки з керівником, безпека) лише запобігають незадоволенню, але не мотивують. <b>Мотиватори</b> (досягнення, визнання, відповідальність, цікава робота, кар'єрне зростання) справді підвищують задоволеність і віддачу.</p>
<p><b>Девід МакКлелланд</b> — теорія набутих потреб: потреба <b>влади</b>, <b>успіху (досягнень)</b> і <b>причетності (приналежності)</b>. Людина з сильною потребою успіху любить завдання середньої складності з чітким зворотним зв'язком.</p>
<p><b>Клейтон Альдерфер</b> — теорія ERG: існування, зв'язок, зростання. На відміну від Маслоу, людина може «спускатися» до нижчих потреб, якщо вищі не задоволені.</p>
<p><b>ПРОЦЕСУАЛЬНІ ТЕОРІЇ</b></p>
<p><b>Віктор Врум</b> (1964) — теорія очікувань: <b>Мотивація = В × І × Ц</b>, де <b>очікування (В)</b> — віра, що зусилля дадуть результат; <b>інструментальність (І)</b> — віра, що результат принесе винагороду; <b>валентність (Ц)</b> — цінність винагороди для людини. Якщо хоча б одне дорівнює нулю, мотивації немає.</p>
<p><b>Стейсі Адамс</b> — теорія справедливості: людина порівнює свої зусилля і винагороду з іншими. Відчуття несправедливості знижує мотивацію.</p>
<p><b>Модель Портера–Лоулера</b> поєднує теорію очікувань і справедливості. Результативна праця веде до задоволення, а не навпаки.</p>
<p><b>Теорія X і Y Дугласа МакГрегора</b>: X — люди ліниві, їх треба контролювати; Y — люди хочуть працювати і брати відповідальність.</p>`,
simple:"Маслоу: поки ти голодний, тобі байдуже до похвали викладача, спершу поїж. Герцберг: холодна аудиторія тебе дратує (гігієнічний фактор), але тепла аудиторія не змусить полюбити предмет. Цікаве завдання — змусить (мотиватор). Врум: ти вчитимешся, тільки якщо віриш, що 1) зможеш вивчити, 2) за це поставлять гарну оцінку, 3) ця оцінка тобі справді потрібна.",
examples:[
"Маслоу на практиці: у 2022 році багато українських компаній насамперед забезпечували безпеку працівників (релокація, укриття, виплати), бо без цього базового рівня вищі мотиватори не працювали.",
"Герцберг: в IT підвищення зарплати швидко стає «нормою» (гігієнічний фактор), а утримують людей цікаві проєкти, менторство і можливість рости (мотиватори).",
"Врум: продавцю пообіцяли поїздку за план, але план нереальний (очікування ≈ 0). Мотивації немає, хоч приз і бажаний.",
"Адамс: працівник дізнався, що новенький на тій самій посаді отримує на 30% більше. Відчуття несправедливості знизило його старанність."

{
id:"liderstvo", title:"Лідерство і стилі керівництва",
min:"Лідерство — здатність впливати на людей, щоб вони добровільно працювали на мету. Курт Левін виділив три стилі: авторитарний, демократичний, ліберальний. Ґратка Блейка–Моутон оцінює турботу про виробництво і про людей. Ситуаційні моделі (Фідлер, Херсі–Бланшар) кажуть: найкращий стиль залежить від ситуації і зрілості підлеглих.",
theory:`<p><b>Лідерство</b> — здатність впливати на окремих людей і групи, спрямовуючи їхні зусилля на досягнення цілей. <b>Керівник</b> отримує повноваження формально (посада), <b>лідер</b> — завдяки авторитету. Ідеально, коли менеджер є і тим, і іншим.</p>
<p><b>1. Теорії рис (особистих якостей)</b> — шукали «вроджені» риси лідера: інтелект, впевненість, енергійність. Універсального набору не знайшли.</p>
<p><b>2. Поведінкові теорії.</b></p>
<ul><li><b>Курт Левін</b> (1939) — три стилі: <b>авторитарний</b> (керівник вирішує сам, жорсткий контроль), <b>демократичний</b> (залучає підлеглих до рішень), <b>ліберальний</b> (мінімальне втручання, свобода дій).</li>
<li><b>Ренсіс Лайкерт</b> — чотири системи: експлуататорсько-авторитарна, доброзичливо-авторитарна, консультативно-демократична, заснована на участі. Також керівники, зосереджені на роботі, vs зосереджені на людині.</li>
<li><b>Ґратка Блейка і Моутон</b> (1964) — дві осі по 9 балів: турбота про виробництво і турбота про людей. Ключові позиції: 1.1 «збіднілий», 9.1 «влада–підкорення» (задача), 1.9 «заміський клуб», 5.5 «організаційне управління» (середина), <b>9.9 «команда»</b> — найефективніший.</li></ul>
<p><b>3. Ситуаційні теорії.</b></p>
<ul><li><b>Фред Фідлер</b> — ефективність залежить від ситуації: стосунки лідера з групою, структурованість завдання, посадові повноваження.</li>
<li><b>Херсі і Бланшар</b> — стиль залежить від <b>зрілості підлеглих</b>: вказівки → «продаж» (переконання) → участь → делегування.</li>
<li><b>«Шлях — мета»</b> (Мітчелл і Хаус) — лідер допомагає підлеглим побачити шлях до мети і винагороди.</li>
<li><b>Модель Врума–Йеттона</b> — як залучати підлеглих до рішень залежно від ситуації.</li></ul>
<p><b>Сучасні підходи:</b> <b>трансформаційне лідерство</b> (надихає баченням і змінює цінності, Бернс, Басс), <b>трансакційне</b> (обмін «результат за винагороду»), <b>харизматичне</b>, <b>служіння (servant leadership)</b>.</p>`,
simple:"Згадай трьох тренерів. Перший кричить і вирішує все сам — авторитарний. Другий радиться з командою, яку тактику обрати, — демократичний. Третій каже «грайте як хочете» і йде пити каву — ліберальний. З новачками краще працює перший, з досвідченою збірною — третій. Це і є ситуаційний підхід.",
examples:[
"Авторитарний стиль доречний у кризі: під час повітряної тривоги керівник зміни на заводі одноосібно і швидко командує евакуацією в укриття.",
"Демократичний стиль: у стартапі команда разом обговорює, які функції додати в застосунок наступного місяця.",
"Ліберальний стиль добре працює з досвідченими дизайнерами чи науковцями, яким потрібна свобода творчості.",
"Херсі–Бланшар: новому стажеру в банку потрібні чіткі інструкції (вказівки), а досвідченому аналітику можна просто делегувати проєкт."
],

{q:"За моделлю Херсі–Бланшара вибір стилю залежить передусім від…",o:["віку керівника","зрілості (готовності) підлеглих","розміру прибутку","кількості відділів"],a:1,e:"Модель життєвого циклу: чим зріліші підлеглі, тим менше вказівок і більше делегування."},
{q:"Керівник надає підлеглим майже повну свободу і мінімально втручається. Це стиль…",o:["авторитарний","демократичний","ліберальний","бюрократичний"],a:2,e:"Ліберальний стиль (laissez-faire)."},
{q:"Лідерство, яке надихає баченням і змінює цінності послідовників, називається…",o:["трансакційним","трансформаційним","авторитарним","бюрократичним"],a:1,e:"Трансформаційне (Дж. Бернс, Б. Басс)."},
{q:"Чим лідер відрізняється від формального керівника?",o:["Лідер завжди має вищу посаду","Лідер впливає завдяки авторитету, а не тільки посаді","Лідер не може бути керівником","Різниці немає"],a:1,e:"Керівника призначають, лідера визнає група. Найкраще, коли це одна людина."}
]},
{
id:"vlada", title:"Влада і вплив",
min:"Влада — можливість впливати на поведінку інших. Френч і Рейвен виділили п'ять основ влади: примус, винагорода, законна (посадова), експертна і еталонна (харизма). Вплив можна здійснювати також переконанням і залученням людей до ухвалення рішень. Влада завжди взаємна: підлеглі теж мають вплив на керівника.",
theory:`<p><b>Вплив</b> — будь-яка поведінка людини, яка змінює поведінку, стосунки чи відчуття іншої людини. <b>Влада</b> — можливість впливати на поведінку інших. <b>Повноваження</b> — формальне, закріплене посадою право використовувати ресурси й давати розпорядження.</p>
<p><b>П'ять основ влади (Дж. Френч і Б. Рейвен, 1959):</b></p>
<ul><li><b>Влада, заснована на примусі</b> — виконавець боїться покарання (догана, штраф, звільнення). Діє швидко, але викликає опір і потребує постійного контролю.</li>
<li><b>Влада, заснована на винагороді</b> — виконавець очікує заохочення (премія, підвищення, вихідний).</li>
<li><b>Законна (традиційна) влада</b> — виконавець визнає, що керівник має право віддавати накази через посаду.</li>
<li><b>Експертна влада</b> — керівник має спеціальні знання, яким виконавець довіряє.</li>
<li><b>Еталонна (харизматична) влада</b> — людина є прикладом, з нею хочеться бути схожими.</li></ul>
<p>Пізніше Рейвен додав <b>інформаційну владу</b> — доступ до важливої інформації.</p>
<p><b>Форми впливу без прямого наказу:</b></p>
<ul><li><b>переконання</b> — ефективна передача своєї точки зору;</li>
<li><b>залучення (участь) працівників в управлінні</b> — люди охочіше виконують рішення, які самі допомогли ухвалити.</li></ul>
<p><b>Баланс влади:</b> підлеглі також мають владу над керівником (знання, зв'язки, можливість звільнитися). Тому менеджер не повинен зловживати владою.</p>
<p><b>Особиста влада</b> (експертна, еталонна) зазвичай дає довготривалий вплив. <b>Посадова</b> (примус, винагорода, законна) — діє, поки людина обіймає посаду.</p>`,
simple:"Чому ти слухаєшся різних людей? Охоронця — бо може не пустити (примус). Батьків, які обіцяли новий телефон за сесію без «хвостів» (винагорода). Декана — бо він декан (законна). Автомеханіка — бо він знає, що з машиною (експертна). Улюбленого блогера — бо хочеш бути як він (еталонна).",
examples:[
"Експертна влада: досвідчений головний інженер на «Турбоатомі», до думки якого прислухається навіть директор, хоча формально той вище.",
"Еталонна влада: засновники відомих українських брендів (наприклад, монобанку) стають прикладом для своїх команд і широкої аудиторії. Їхній вплив виходить за межі посади.",
"Влада через винагороду: менеджер магазину обіцяє обраний вихідний тому, хто першим виконає план продажів.",
"Залучення: перед переходом на нову CRM-систему керівник просить продавців протестувати варіанти і разом обрати найзручніший. Опір змінам зменшується."
],

{q:"Що з наведеного НЕ належить до основ влади за Френчем і Рейвеном?",o:["Примус","Винагорода","Синергія","Законна влада"],a:2,e:"Синергія — властивість систем, а не основа влади."}
]},
{
id:"komunikatsii", title:"Комунікації в управлінні",
min:"Комунікація — обмін інформацією між людьми. Процес: відправник кодує ідею → обирає канал → отримувач декодує → дає зворотний зв'язок. Заважає «шум». Комунікації бувають вертикальні (згори вниз і знизу вгору), горизонтальні, формальні й неформальні (чутки). Менеджери витрачають на комунікації більшу частину робочого часу.",
theory:`<p><b>Комунікація</b> — обмін інформацією і її змістом між двома або більше людьми. Це <b>зв'язуючий процес</b>, без якого неможлива жодна функція менеджменту.</p>
<p><b>Елементи процесу:</b> <b>відправник</b>, <b>повідомлення</b>, <b>канал</b>, <b>отримувач</b>.</p>
<p><b>Етапи:</b> 1) зародження ідеї; 2) кодування і вибір каналу (мова, жести, лист, месенджер, зустріч); 3) передача; 4) декодування — отримувач перекладає символи у свої думки. Далі — <b>зворотний зв'язок</b>, що показує, чи зрозуміли повідомлення.</p>
<p><b>Шум</b> — все, що спотворює зміст: мовні відмінності, різне сприйняття, гамір, погане з'єднання, відволікання.</p>
<p><b>Види комунікацій в організації:</b></p>
<ul><li><b>між організацією і середовищем</b> (реклама, звітність, PR);</li>
<li><b>між рівнями</b> — вертикальні: <b>низхідні</b> (накази, завдання) і <b>висхідні</b> (звіти, пропозиції, скарги);</li>
<li><b>горизонтальні</b> — між підрозділами одного рівня;</li>
<li><b>«керівник — підлеглий»</b>, <b>«керівник — робоча група»</b>;</li>
<li><b>формальні</b> (за структурою) і <b>неформальні</b> (канали чуток).</li></ul>
<p><b>Міжособистісні бар'єри:</b> бар'єри сприйняття, <b>семантичні</b> (різне розуміння слів), <b>невербальні</b> (жести, міміка, інтонація суперечать словам), поганий зворотний зв'язок, невміння слухати.</p>
<p><b>Організаційні бар'єри:</b> спотворення повідомлень під час руху рівнями, перевантаження інформацією, погана структура.</p>
<p><b>Як покращити:</b> регулювати інформаційні потоки, проводити наради, використовувати системи зворотного зв'язку, скриньки пропозицій, внутрішні розсилки, корпоративні месенджери.</p>`,
simple:"Згадай гру «зіпсований телефон». Перша людина шепоче «менеджмент», а остання чує «мед і мент». Кожна передача — це кодування й декодування, а гамір і поспіх — шум. Щоб не було зіпсованого телефону, треба перепитувати: «Я правильно зрозумів, що…?» Це і є зворотний зв'язок.",

{
id:"rishennia", title:"Прийняття управлінських рішень",
min:"Управлінське рішення — вибір альтернативи з кількох варіантів. Рішення бувають запрограмовані (типові, за правилом) і незапрограмовані (нові ситуації). За способом ухвалення: інтуїтивні, засновані на судженнях, раціональні. Раціональний процес: діагноз проблеми → обмеження і критерії → альтернативи → оцінка → вибір → реалізація і зворотний зв'язок.",
theory:`<p><b>Управлінське рішення</b> — вибір, який має зробити керівник у межах своєї посади. Це зв'язуючий процес, який присутній у всіх функціях.</p>
<p><b>Види рішень:</b></p>
<ul><li><b>запрограмовані</b> — результат певної послідовності кроків (повторювані ситуації: замовлення товару при залишку менше норми);</li>
<li><b>незапрограмовані</b> — нові, неструктуровані ситуації (вихід на новий ринок, реакція на кризу).</li></ul>
<p><b>Підходи до ухвалення:</b> <b>інтуїтивні</b> (на відчутті правильності), <b>засновані на судженнях</b> (на знаннях і досвіді), <b>раціональні</b> (на об'єктивному аналізі).</p>
<p><b>Етапи раціонального рішення:</b></p>
<ol><li>Діагностика проблеми (визначити симптоми і причини).</li>
<li>Формулювання обмежень і критеріїв ухвалення рішення.</li>
<li>Визначення альтернатив.</li>
<li>Оцінка альтернатив.</li>
<li>Вибір альтернативи.</li>
<li>Реалізація і зворотний зв'язок (контроль результату).</li></ol>
<p><b>Умови ухвалення:</b> <b>визначеність</b> (результат відомий), <b>ризик</b> (відома ймовірність результатів), <b>невизначеність</b> (ймовірності невідомі).</p>
<p><b>Обмежена раціональність</b> (Герберт Саймон, Нобелівська премія 1978): люди не можуть врахувати все, тому часто обирають не найкращий, а <b>задовільний</b> варіант.</p>
<p><b>Методи:</b> <b>«мозковий штурм»</b> (А. Осборн; спочатку генерують ідеї без критики, потім оцінюють), <b>метод Дельфі</b> (кілька раундів анонімного опитування експертів), <b>дерево рішень</b>, <b>платіжна матриця</b>, моделювання, <b>метод номінальної групи</b>.</p>
<p><b>Групові vs індивідуальні рішення:</b> група дає більше ідей і краще сприйняття рішення, але працює довше і ризикує «груповим мисленням» (згода заради злагоди).</p>`,
simple:"Ти обираєш ноутбук для навчання. Проблема: старий гальмує (діагноз). Обмеження: бюджет до 25 тисяч, вага до 2 кг (критерії). Альтернативи: три моделі. Порівнюєш відгуки (оцінка), купуєш одну (вибір), через місяць перевіряєш, чи задоволений (зворотний зв'язок). Що купуєш хліб щоранку в тій самій пекарні — це запрограмоване рішення.",
examples:[

{q:"Концепцію «обмеженої раціональності» запропонував…",o:["Г. Саймон","Ф. Тейлор","П. Друкер","А. Файоль"],a:0,e:"Герберт Саймон: люди обирають задовільний, а не ідеальний варіант."},
{q:"Головна небезпека групового ухвалення рішень:",o:["Забагато ідей","«Групове мислення» — згода заради злагоди","Занадто швидко","Ніхто не бере участі"],a:1,e:"Група може відкидати критику, щоб зберегти злагоду."}

{
id:"konflikty", title:"Конфлікти і стреси",
min:"Конфлікт — відсутність згоди між сторонами. Він буває функціональним (корисним) і дисфункціональним (шкідливим). Типи: внутрішньоособистісний, міжособистісний, між особою і групою, міжгруповий. Стилі за Томасом–Кілманном: уникнення, пристосування, суперництво (примус), компроміс, співпраця. Стрес — напружений стан. Корисний стрес називають еустресом, шкідливий — дистресом.",
theory:`<p><b>Конфлікт</b> — відсутність згоди між двома або більше сторонами (людьми чи групами). Кожна сторона прагне, щоб прийняли її погляди чи цілі.</p>
<p><b>Наслідки:</b> <b>функціональний</b> конфлікт підвищує ефективність (нові ідеї, краще рішення); <b>дисфункціональний</b> — знижує задоволеність, співпрацю і продуктивність.</p>
<p><b>Типи конфліктів:</b> внутрішньоособистісний (суперечливі вимоги до однієї людини), міжособистісний, між особою і групою, міжгруповий.</p>
<p><b>Причини:</b> розподіл ресурсів, взаємозалежність завдань, розбіжності в цілях, у поглядах і цінностях, у манері поведінки і досвіді, незадовільні комунікації.</p>
<p><b>Модель процесу конфлікту:</b> причина → ситуація → (визнання) → конфлікт → управління → функціональні або дисфункціональні наслідки.</p>
<p><b>Структурні методи управління:</b> роз'яснення вимог до роботи, координаційні та інтеграційні механізми, загальноорганізаційні комплексні цілі, структура системи винагород.</p>
<p><b>Міжособистісні стилі (модель Томаса–Кілманна):</b></p>
<ul><li><b>уникнення</b> — піти від конфлікту;</li>
<li><b>пристосування (згладжування)</b> — поступитися заради стосунків;</li>
<li><b>суперництво (примус)</b> — домогтися свого будь-якою ціною;</li>
<li><b>компроміс</b> — кожен трохи поступається;</li>
<li><b>співпраця (вирішення проблеми)</b> — знайти рішення, вигідне обом. Вважається найефективнішим для важливих питань.</li></ul>
<p><b>Стрес</b> — напружений стан, реакція організму на подразники. Поняття ввів <b>Ганс Сельє</b>. <b>Еустрес</b> — корисний, мобілізує. <b>Дистрес</b> — шкідливий.</p>
<p><b>Організаційні причини стресу:</b> перевантаження або недовантаження, рольовий конфлікт (суперечливі вимоги), рольова невизначеність, нецікава робота, погані фізичні умови. <b>Особисті:</b> події життя (переїзд, втрата, хвороба), фінансові проблеми.</p>
<p><b>Як знизити стрес:</b> керівник — чітко ставити завдання, розподіляти навантаження, давати зворотний зв'язок, дозволяти перерви. Працівник — розставляти пріоритети, вчитися казати «ні», мати відпочинок, сон і фізичну активність.</p>`,
simple:"Ти з сусідом по гуртожитку сваришся, хто миє посуд. Можна мовчати і мити самому (пристосування), не приходити додому (уникнення), накричати (суперництво), мити по черзі через день (компроміс) або разом купити посудомийку навпіл і забути про проблему (співпраця). Стрес перед іспитом, що змушує вчитися, — еустрес. Безсоння і паніка — уже дистрес.",
examples:[
"Функціональний конфлікт: у команді розробників суперечка про архітектуру застосунку призвела до кращого технічного рішення.",
"Міжгруповий конфлікт: відділ продажів хоче давати клієнтам знижки, а фінансовий відділ — тримати маржу. Спільна ціль «прибуток компанії» і спільні KPI допомагають його погасити.",

"Підтримка працівників: у 2022–2024 роках низка українських компаній запустила програми психологічної підтримки та гнучкий графік, щоб знизити дистрес співробітників."
],

{
id:"efektyvnist", title:"Ефективність менеджменту",
min:"Ефективність — співвідношення результату і витрат. Друкер: результативність означає «робити правильні речі», а ефективність (економічність) — «робити речі правильно». Оцінюють економічну, соціальну і організаційну ефективність. Інструменти — KPI, рентабельність, продуктивність праці.",
theory:`<p><b>Ефективність управління</b> — відношення отриманих результатів до витрат на їх досягнення.</p>
<p><b>Пітер Друкер</b> розрізняв:</p>
<ul><li><b>результативність (effectiveness)</b> — «робити правильні речі»: досягати потрібних цілей;</li>
<li><b>ефективність, економічність (efficiency)</b> — «робити речі правильно»: досягати мети з мінімальними витратами.</li></ul>
<p><b>Види ефективності:</b></p>
<ul><li><b>економічна</b> — прибуток, рентабельність, продуктивність, зниження собівартості;</li>
<li><b>соціальна</b> — задоволеність працівників і клієнтів, умови праці, внесок у суспільство;</li>
<li><b>організаційна</b> — швидкість рішень, чіткість структури, витрати на апарат управління.</li></ul>
<p><b>Основні показники:</b></p>
<ul><li><b>рентабельність</b> = прибуток / витрати (або / виручка) × 100%;</li>
<li><b>продуктивність праці</b> = обсяг продукції / кількість працівників (або відпрацьований час);</li>
<li><b>частка витрат на управління</b> у загальних витратах;</li>
<li><b>KPI</b> (ключові показники ефективності) — вимірні показники досягнення цілей (кількість клієнтів, середній чек, час доставки);</li>
<li><b>збалансована система показників (BSC)</b> Каплана і Нортона — чотири перспективи: фінанси, клієнти, внутрішні процеси, навчання і розвиток.</li></ul>
<p><b>Чинники ефективності:</b> кваліфікація менеджерів, організаційна структура, мотивація персоналу, корпоративна культура, технології, якість інформації.</p>

/* ---------- topic status ---------- */
function status(id){
  var b=S.best[id];
  if(b!=null && b>=PASS) return {cls:"pass",txt:"Пройдено · "+b+"%"};
  if(b!=null) return {cls:"low",txt:"Тест "+b+"%"};
  if(S.read[id]) return {cls:"read",txt:"Прочитано"};
  return {cls:"",txt:"Не почато"};
}
function passedCount(){return TOPICS.filter(function(t){return S.best[t.id]>=PASS;}).length;}
function avgScore(){ if(!S.attempts.length) return null; var s=0; S.attempts.forEach(function(a){s+=pct(a.s,a.t);}); return Math.round(s/S.attempts.length);}
function knownCards(){var n=0; for(var k in S.cards) if(S.cards[k]==="know") n++; return n;}

/* ---------- Quiz engine ---------- */
var quiz=null;
function buildExam(){
  var picked=[], rest=[];
  shuffle(TOPICS).forEach(function(t){var qs=shuffle(t.quiz.map(function(q){return {q:q,tid:t.id};})); picked.push(qs[0]); rest=rest.concat(qs.slice(1));});
  // 15 (one per topic) + 5 extra from different topics
  var used={}; shuffle(rest).forEach(function(x){ if(picked.length<20 && !used[x.tid]){used[x.tid]=1; picked.push(x);} });
  return shuffle(picked);
}
function startQuiz(mode,tid){
  var items = mode==="exam" ? buildExam() : shuffle(TMAP[tid].quiz.map(function(q){return {q:q,tid:tid};}));
  items=items.map(function(it){return {q:it.q,tid:it.tid,order:shuffle(it.q.o.map(function(_,i){return i;})),pick:null};});
  current="quiz"; setTab("test");
  quiz={mode:mode,tid:tid,items:items,i:0,score:0};
  renderQ(); window.scrollTo(0,0);
}
function renderQ(){
  var it=quiz.items[quiz.i], n=quiz.items.length, L="АБВГД";
  var title = quiz.mode==="exam" ? "Підготовка до іспиту" : "Тест: "+TMAP[quiz.tid].title;
  var h='<div class="stack"><button class="back" type="button" id="qExit">‹ Вийти з тесту</button>'+
  '<div class="stack-s"><span class="eyebrow">'+esc(title)+'</span><div class="sec-h"><b>Питання '+(quiz.i+1)+' з '+n+'</b><span class="lead">Правильно: '+quiz.score+'</span></div><div class="qbar"><i style="width:'+pct(quiz.i,n)+'%"></i></div></div>'+
  (quiz.mode==="exam"?'<span class="chip wrap" style="align-self:flex-start">Тема '+TMAP[it.tid].num+'. '+esc(TMAP[it.tid].title)+'</span>':'')+
  '<p class="qtext">'+esc(it.q.q)+'</p><div class="opts">';
  it.order.forEach(function(oi,k){h+='<button class="opt" type="button" data-oi="'+oi+'"><span class="k">'+L[k]+'</span><span>'+esc(it.q.o[oi])+'</span></button>';});
  h+='</div><div id="qAfter"></div></div>';
  $view.innerHTML=h;
  document.getElementById("qExit").addEventListener("click",function(){ if(quiz.mode==="exam") go("test"); else go("topic",quiz.tid);});
  [].forEach.call($view.querySelectorAll(".opt"),function(b){b.addEventListener("click",function(){answer(+b.dataset.oi);});});
}
function answer(oi){
  var it=quiz.items[quiz.i]; if(it.pick!=null) return; it.pick=oi;
  var ok = oi===it.q.a; if(ok) quiz.score++;
  [].forEach.call($view.querySelectorAll(".opt"),function(b){var v=+b.dataset.oi; b.disabled=true; if(v===it.q.a) b.classList.add("right"); else if(v===oi) b.classList.add("wrong");});
  var last = quiz.i===quiz.items.length-1;
  document.getElementById("qAfter").innerHTML='<div class="stack-s"><div class="explain"><b style="color:'+(ok?"var(--good)":"var(--bad)")+'">'+(ok?"Правильно!":"Неправильно")+'</b>'+esc(it.q.e)+'</div><button class="btn primary block" type="button" id="qNext">'+(last?"Показати результат":"Далі")+'</button></div>';
  var nb=document.getElementById("qNext"); nb.focus({preventScroll:true}); nb.scrollIntoView({block:"nearest",behavior:"smooth"});
  nb.addEventListener("click",function(){ if(last) finish(); else {quiz.i++; renderQ(); window.scrollTo(0,0);} });
}
function finish(){
  var n=quiz.items.length, p=pct(quiz.score,n);
  S.attempts.push({m:quiz.mode,tid:quiz.tid||null,s:quiz.score,t:n,d:Date.now()}); if(S.attempts.length>200) S.attempts=S.attempts.slice(-200);
  var wrongBy={};
  quiz.items.forEach(function(it){ if(it.pick!==it.q.a) wrongBy[it.tid]=(wrongBy[it.tid]||0)+1; });
  if(quiz.mode==="topic"){ if(S.best[quiz.tid]==null || p>S.best[quiz.tid]) S.best[quiz.tid]=p; S.read[quiz.tid]=true; }
  save();
  var verdict = p>=90?"Відмінно! Ви готові.":p>=PASS?"Добре! Залишилось трохи підтягнути.":p>=50?"Непогано, але варто повторити теми нижче.":"Поки слабко. Повторіть теорію і спробуйте ще раз.";
  var h='<div class="stack"><span class="eyebrow">'+(quiz.mode==="exam"?"Результат пробного іспиту":"Результат тесту · "+esc(TMAP[quiz.tid].title))+'</span>'+
  '<div class="card score-ring"><span class="big" style="color:'+(p>=PASS?"var(--good)":"var(--bad)")+'">'+p+'%</span><div><b>'+quiz.score+' з '+n+' правильно</b><p class="lead">'+verdict+'</p></div></div>';
  var ids=Object.keys(wrongBy).sort(function(a,b){return wrongBy[b]-wrongBy[a];});
  if(quiz.mode==="exam"){
    h+= ids.length? '<section class="stack-s"><h2>Теми, які треба повторити</h2><ul class="review">'+ids.map(function(id){return '<li><button type="button" data-open="'+id+'"><span>'+TMAP[id].num+'. '+esc(TMAP[id].title)+'</span><span class="chip low">'+wrongBy[id]+' '+plural(wrongBy[id],"помилка","помилки","помилок")+'</span></button></li>';}).join("")+'</ul></section>' : '<p class="lead">Жодної помилки. Чудова робота!</p>';
  }
  var wrongs=quiz.items.filter(function(it){return it.pick!==it.q.a;});
  if(wrongs.length){ h+='<section class="stack-s"><h2>Розбір помилок</h2>'+wrongs.map(function(it){return '<div class="card stack-s"><b>'+esc(it.q.q)+'</b><p>Ваша відповідь: <span style="color:var(--bad)">'+esc(it.q.o[it.pick])+'</span></p><p>Правильно: <span style="color:var(--good);font-weight:600">'+esc(it.q.o[it.q.a])+'</span></p><p class="lead">'+esc(it.q.e)+'</p></div>';}).join("")+'</section>'; }
  h+='<div class="row"><button class="btn primary" type="button" id="again">Пройти ще раз</button>'+(quiz.mode==="topic"?'<button class="btn" type="button" data-open="'+quiz.tid+'">До теорії</button>':'<button class="btn" type="button" data-go="progress">Мій прогрес</button>')+'</div></div>';
  var m=quiz.mode,t=quiz.tid;
  $view.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("again").addEventListener("click",function(){startQuiz(m,t);});
}

  '<section class="stack-s"><h2>Тести за темами</h2><ul class="review">'+TOPICS.map(function(t){var st=status(t.id);return '<li><button type="button" data-quiz="'+t.id+'"><span>'+t.num+'. '+esc(t.title)+'</span><span class="chip '+st.cls+'">'+(S.best[t.id]!=null?S.best[t.id]+"%":t.quiz.length+" пит.")+'</span></button></li>';}).join("")+'</ul></section></div>';
  $view.innerHTML=h;
  document.getElementById("examBtn").addEventListener("click",function(){startQuiz("exam");});
  [].forEach.call($view.querySelectorAll("[data-quiz]"),function(b){b.addEventListener("click",function(){startQuiz("topic",b.dataset.quiz);});});
