function fmtDate(ms){var d=new Date(ms);function z(n){return (n<10?"0":"")+n;} return z(d.getDate())+"."+z(d.getMonth()+1)+" о "+z(d.getHours())+":"+z(d.getMinutes());}

/* ---------- Cards ---------- */
var deck=[],di=0;
function buildDeck(){
  deck=shuffle(GLOSSARY.filter(function(g){var st=S.cards[g[0]]; return S.cardFilter==="all"||(S.cardFilter==="know"?st==="know":st!=="know");}));
  di=0;
}
function renderCards(rebuild){
  if(rebuild!==false) buildDeck();
  var total=GLOSSARY.length,known=knownCards();
  var f=S.cardFilter;
  var h='<div class="stack"><div class="stack-s"><h1>Картки</h1><p class="lead">Торкніться картки, щоб перевернути. Знаєте: '+known+' з '+total+'.</p></div>'+
  '<div class="chips" role="group" aria-label="Фільтр карток">'+[["all","Усі"],["learn","Ще вчу"],["know","Знаю"]].map(function(c){return '<button class="fchip" type="button" data-f="'+c[0]+'" aria-pressed="'+(f===c[0])+'">'+c[1]+'</button>';}).join("")+
  '<button class="fchip" type="button" id="sideBtn" aria-pressed="false">Спершу: '+(S.cardSide==="term"?"термін":"визначення")+'</button></div><div id="cardArea"></div></div>';
  $view.innerHTML=h;
  [].forEach.call($view.querySelectorAll("[data-f]"),function(b){b.addEventListener("click",function(){S.cardFilter=b.dataset.f; save(); renderCards();});});
  document.getElementById("sideBtn").addEventListener("click",function(){S.cardSide=S.cardSide==="term"?"def":"term"; save(); renderCards(false);});
  drawCard();
}
function drawCard(){
  var area=document.getElementById("cardArea");
  if(!deck.length){area.innerHTML='<div class="card stack-s"><b>'+(S.cardFilter==="know"?"Тут поки порожньо":"Усі картки вивчено!")+'</b><p class="lead">'+(S.cardFilter==="know"?"Позначайте картки «Знаю», і вони з'являться тут.":"Перегляньте фільтр «Усі», щоб повторити.")+'</p></div>';return;}
  if(di>=deck.length){area.innerHTML='<div class="card stack-s"><b>Колоду пройдено</b><p class="lead">Ви переглянули '+deck.length+' '+plural(deck.length,"картку","картки","карток")+'.</p><button class="btn primary" type="button" id="reDeck">Перемішати і почати знову</button></div>';document.getElementById("reDeck").addEventListener("click",function(){renderCards();});return;}
  var g=deck[di], st=S.cards[g[0]];
  var front=S.cardSide==="term"?'<span class="term">'+esc(g[0])+'</span>':'<span class="def">'+esc(g[1])+'</span>';
  var back=S.cardSide==="term"?'<span class="def">'+esc(g[1])+'</span>':'<span class="term">'+esc(g[0])+'</span>';
  area.innerHTML='<div class="stack-s"><div class="sec-h"><span class="lead">Картка '+(di+1)+' з '+deck.length+'</span><span class="state-dot" style="color:'+(st==="know"?"var(--good)":"var(--muted)")+'">'+(st==="know"?"● знаю":st==="learn"?"● ще вчу":"○ нова")+'</span></div>'+
  '<button class="flash" type="button" id="flash" aria-label="Перевернути картку"><div class="flash-in"><div class="face">'+front+'<span class="hint">Торкніться, щоб побачити відповідь</span></div><div class="face back-f">'+back+'<span class="hint">Тема '+TMAP[g[2]].num+'. '+esc(TMAP[g[2]].title)+'</span></div></div></button>'+
  '<div class="row"><button class="btn" type="button" id="cLearn">Ще вчу</button><button class="btn primary" type="button" id="cKnow">Знаю</button></div></div>';
  var fl=document.getElementById("flash");
  fl.addEventListener("click",function(){fl.classList.toggle("flipped");});
  function mark(v){S.cards[g[0]]=v; save(); di++; drawCard();}
  document.getElementById("cLearn").addEventListener("click",function(){mark("learn");});
  document.getElementById("cKnow").addEventListener("click",function(){mark("know");});
}

/* ---------- Glossary ---------- */
function renderGloss(){
  $view.innerHTML='<div class="stack"><div class="stack-s"><h1>Словник</h1><p class="lead">'+GLOSSARY.length+' термінів. Шукайте за назвою або словом з визначення.</p></div>'+
  '<input class="search" id="gq" type="search" placeholder="Наприклад: мотивація, SWOT, Вебер" autocomplete="off" aria-label="Пошук у словнику"><p class="lead" id="gcount"></p><ul class="glist" id="glist"></ul></div>';
  var q=document.getElementById("gq");
  q.addEventListener("input",function(){drawGloss(q.value);});
  drawGloss("");
}
function drawGloss(q){
  q=q.trim().toLowerCase();
  var items=GLOSSARY.filter(function(g){return !q||g[0].toLowerCase().indexOf(q)>-1||g[1].toLowerCase().indexOf(q)>-1;})
    .sort(function(a,b){return a[0].localeCompare(b[0],"uk");});
  function hi(s){ if(!q) return esc(s); var low=s.toLowerCase(),out="",i=0,j; while((j=low.indexOf(q,i))>-1){out+=esc(s.slice(i,j))+"<mark>"+esc(s.slice(j,j+q.length))+"</mark>"; i=j+q.length;} return out+esc(s.slice(i)); }
  document.getElementById("gcount").textContent=q?("Знайдено: "+items.length):"";
  document.getElementById("glist").innerHTML=items.length?items.map(function(g){return '<li><div class="gt">'+hi(g[0])+'</div><div class="gd">'+hi(g[1])+'</div><button class="gl" type="button" data-open="'+g[2]+'">Тема '+TMAP[g[2]].num+'. '+esc(TMAP[g[2]].title)+' ›</button></li>';}).join(""):'<li class="empty">Нічого не знайдено. Спробуйте коротше слово.</li>';
}

/* ---------- Progress ---------- */
function renderProgress(){
  var avg=avgScore(), readN=Object.keys(S.read).length;
  var h='<div class="stack"><h1>Мій прогрес</h1>'+
  '<div class="summary"><div class="stat"><b>'+passedCount()+'/15</b><span>тем пройдено</span></div><div class="stat"><b>'+(avg==null?"—":avg+"%")+'</b><span>середній бал тестів</span></div><div class="stat"><b>'+S.attempts.length+'</b><span>'+plural(S.attempts.length,"спроба","спроби","спроб")+'</span></div></div>'+
  '<div class="summary"><div class="stat"><b>'+readN+'/15</b><span>прочитано</span></div><div class="stat"><b>'+knownCards()+'/'+GLOSSARY.length+'</b><span>карток знаю</span></div><div class="stat"><b>'+PASS+'%</b><span>поріг заліку теми</span></div></div>'+
  '<section class="card stack"><h2>Найкращий бал за темами</h2>'+TOPICS.map(function(t){var b=S.best[t.id];return '<div class="pt"><span class="name">'+t.num+'. '+esc(t.title)+'</span><span class="val">'+(b==null?"—":b+"%")+'</span><div class="bar"><i class="'+(b==null?"":b>=PASS?"good":"bad")+'" style="width:'+(b||0)+'%"></i></div></div>';}).join("")+'</section>';
  var weak=TOPICS.filter(function(t){return S.best[t.id]==null||S.best[t.id]<PASS;});
  h+='<section class="stack-s"><h2>Що повторити далі</h2>'+(weak.length?'<ul class="review">'+weak.slice(0,5).map(function(t){var st=status(t.id);return '<li><button type="button" data-open="'+t.id+'"><span>'+t.num+'. '+esc(t.title)+'</span><span class="chip '+st.cls+'">'+st.txt+'</span></button></li>';}).join("")+'</ul>':'<p class="lead">Усі теми пройдено. Спробуйте пробний іспит у вкладці «Тест».</p>')+'</section>';
  var last=S.attempts.slice(-8).reverse();
  h+='<section class="card stack-s"><h3>Останні спроби</h3>'+(last.length?'<ul class="hist">'+last.map(function(a){return '<li><span>'+(a.m==="exam"?"Пробний іспит":"Тема "+(TMAP[a.tid]?TMAP[a.tid].num:"?"))+' · '+fmtDate(a.d)+'</span><span>'+pct(a.s,a.t)+'%</span></li>';}).join("")+'</ul>':'<p class="empty">Пройдіть перший тест, і результати з\'являться тут.</p>')+'</section>'+
  '<div id="resetArea"><button class="btn danger block" type="button" id="resetBtn">Скинути весь прогрес</button></div></div>';
  $view.innerHTML=h;
  document.getElementById("resetBtn").addEventListener("click",function(){
    document.getElementById("resetArea").innerHTML='<div class="confirm stack-s"><b>Видалити всі результати, позначки й картки?</b><p class="lead">Цю дію не можна скасувати.</p><div class="row"><button class="btn" type="button" id="rNo">Скасувати</button><button class="btn danger" type="button" id="rYes">Так, скинути</button></div></div>';
    document.getElementById("rNo").addEventListener("click",renderProgress);
    document.getElementById("rYes").addEventListener("click",function(){var th=S.theme; S=defaults(); S.theme=th; save(); toast("Прогрес скинуто"); renderProgress();});
  });
}

applyTheme(); go("topics");
})();
</script>

if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
