# Публікує веб-версію на GitHub Pages (її можна встановити на iPhone і Android через браузер)
name: GitHub Pages

on:
  push:
    paths-ignore:
      - "android-build/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Зібрати файли сайту
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons .nojekyll _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3

      - id: deployment
        uses: actions/deploy-pages@v4
