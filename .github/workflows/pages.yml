# Оновлює веб-версію на GitHub Pages: копіює файли сайту в гілку gh-pages
# (її можна встановити на iPhone і Android через браузер)
name: GitHub Pages

on:
  push:
    branches-ignore:
      - gh-pages
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "icons/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Оновити гілку gh-pages
        run: |
          mkdir ../site
          cp -r index.html manifest.webmanifest sw.js icons .nojekyll ../site/
          git fetch --depth=1 origin gh-pages
          git checkout -B gh-pages FETCH_HEAD
          git rm -rq .
          cp -r ../site/. .
          git add -A
          if git diff --cached --quiet; then echo "Змін немає"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Оновити сайт з ${GITHUB_SHA::7}"
          git push origin gh-pages
